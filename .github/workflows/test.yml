name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            shell: pwsh
          - name: Windows PowerShell 5.1
            shell: powershell
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install test modules
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: PSScriptAnalyzer
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./Test-DLUpgradeReadiness.ps1
          $issues | Format-Table RuleName, Severity, Line, Message -AutoSize -Wrap
          if ($issues) { throw "PSScriptAnalyzer reported $(@($issues).Count) issue(s)." }

      - name: Pester
        run: |
          Import-Module Pester -MinimumVersion 5.5
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
